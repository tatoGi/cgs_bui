<!doctype html>
<html lang="ka" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dashboard - CGS</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="assets/css/style.css" />
    <link rel="stylesheet" href="assets/css/responsive.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <!-- Navbar -->
    <nav class="navbar" role="navigation" aria-label="main navigation">
      <div class="navbar-brand">
        <button class="sidebar-toggle" id="toggleSidebar">
          <i class="fas fa-bars"></i>
        </button>
        <a class="navbar-item" href="index.html">
          <img src="assets/logo/logo.png" alt="CGS Logo" />
        </a>

        <a
          role="button"
          class="navbar-burger"
          aria-label="menu"
          aria-expanded="false"
          data-target="sidebarMain"
        >
          <span aria-hidden="true"></span>
          <span aria-hidden="true"></span>
          <span aria-hidden="true"></span>
          <span aria-hidden="true"></span>
        </a>
      </div>

      <!-- Global Search using Bulma Panel style -->
      <div class="search-container is-hidden-touch">
        <div class="panel-block search-panel-block">
          <p class="control has-icons-left">
            <input
              class="input search-input"
              type="text"
              placeholder="ძებნა..."
            />
            <span class="icon is-left">
              <i class="fas fa-search"></i>
            </span>
          </p>
        </div>
        <p class="panel-tabs search-panel-tabs">
          <a class="is-active">ყველა</a>
          <a>რეპორტები</a>
          <a>ფინანსები</a>
          <a>მომხმარებლები</a>
          <a>სხვა</a>
        </p>
      </div>

      <div class="navbar-end">
        <!-- Notifications icon -->
        <div class="navbar-item">
          <a class="button is-light is-rounded" style="position: relative">
            <span class="icon">
              <i class="fas fa-bell"></i>
            </span>
            <span class="notification-badge">3</span>
          </a>
        </div>

        <!-- User Dropdown -->
        <div class="navbar-item has-dropdown is-hoverable">
          <a class="navbar-link is-arrowless">
            <div class="user-avatar">T</div>
            <span class="is-hidden-touch">Tato G.</span>
          </a>

          <div class="navbar-dropdown is-right">
            <a class="navbar-item" href="#">
              <i class="fas fa-user-circle"></i> პროფილი
            </a>
            <hr class="navbar-divider" />
            <a class="navbar-item has-text-danger" href="login.html">
              <i class="fas fa-sign-out-alt"></i> გასვლა
            </a>
          </div>
        </div>
      </div>
    </nav>
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebarMain">
      <div class="sidebar-user">
        <div class="user-avatar">T</div>
        <div class="user-info">
          <span class="user-name">Tato G.</span>
          <span class="user-role">ადმინისტრატორი</span>
        </div>
      </div>

      <nav class="sidebar-menu">
        <a href="index.html" class="sidebar-link">
          <i class="fas fa-home"></i> <span>მთავარი</span>
        </a>
        <a href="loans.html" class="sidebar-link">
          <i class="fas fa-chart-bar"></i> <span>სესხები</span>
        </a>
        <a href="upload.html" class="sidebar-link">
          <i class="fas fa-upload"></i> <span>ინფორმაციის ატვირთვა</span>
        </a>

        <div class="has-dropdown">
          <a href="#" class="sidebar-link dropdown-trigger">
            <i class="fas fa-exchange-alt"></i>
            <span>ფინანსები</span>
            <span
              class="icon is-small is-right dropdown-icon"
              style="margin-left: auto"
            >
              <i class="fas fa-angle-down"></i>
            </span>
          </a>
          <div class="sidebar-dropdown">
            <a href="finance_guarantee.html" class="submenu-link"
              >გარანტიის საკომისიო</a
            >
            <a href="finance_received.html" class="submenu-link"
              >მისაღები გარანტია</a
            >
            <a href="finance_transfer.html" class="submenu-link"
              >გადასარიცხი გარანტია</a
            >
          </div>
        </div>

        <a href="users.html" class="sidebar-link">
          <i class="fas fa-user"></i> <span>მომხმარებლის მართვა</span>
        </a>
      </nav>
    </aside>
    <main class="main-content">
      <div class="container is-fluid"></div>
    </main>
  </body>
</html>
